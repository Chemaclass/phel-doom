# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/docs/schemas/config.schema.json
version: 1

sources:
  agents: .agnostic-ai/agents
  skills: .agnostic-ai/skills
  rules: .agnostic-ai/rules
  hooks: .agnostic-ai/hooks
  mcps: .agnostic-ai/mcps
  commands: .agnostic-ai/commands

targets:
  - claude
  - codex

# Keep Claude's instructions at the nested .claude/CLAUDE.md (a documented
# Claude Code project-memory location) instead of the root CLAUDE.md.
# Codex still gets the same body at the root AGENTS.md.
outputs:
  claude:
    file: .claude/CLAUDE.md

on-unsupported: warn

# Generated agent config (.claude/, AGENTS.md, ...) is disposable: it is
# rebuilt by `agnostic-ai sync` from the specs above. Let the tool own its
# .gitignore block so every output is ignored and stays current.
gitignore:
  enabled: true
